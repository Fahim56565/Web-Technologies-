<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h2>
        Registration Form
    </h2>

    <form action="#" method="post">

        <label for="fullname">Full Name:</label><br>
        <input type="text" id="fullname" name="fullname" required><br><br>  

        <label for="fathername">Father's Name:</label><br>
        <input type="text" id="fathername" name="fathername"><br><br>

        <label for="mothername">Mother's Name:</label><br>
        <input type="text" id="mothername" name="mothername"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Phone Number:</label><br>
        <input type="tel" id="phone" name="phone" required><br><br>

        <label>Gender:</label><br>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="bloodgroup">Blood Group:</label><br>
        <select id="bloodgroup" name="bloodgroup">
            <option value="">-- Select --</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
        </select><br><br>

        <label for="nationality">Nationality:</label><br>
        <input type="text" id="nationality" name="nationality" value="Bangladeshi"><br><br>

        <label for="country">Country:</label><br>
        <select id="country" name="country">
            <option value="Bangladesh">Bangladesh</option>
            <option value="India">India</option>
            <option value="Pakistan">Pakistan</option>
            <option value="Nepal">Nepal</option>
            <option value="Other">Other</option>
        </select><br><br>

        <label for="address">Address:</label><br>
        <textarea id="address" name="address" rows="4" cols="30"></textarea><br><br>

        <label for="city">City:</label><br>
        <input type="text" id="city" name="city"><br><br>

        <label for="postcode">Postal Code:</label><br>
        <input type="text" id="postcode" name="postcode"><br><br>

        <label for="studentid">Student ID:</label><br>
        <input type="text" id="studentid" name="studentid" placeholder="XX-XXXXX-X"><br><br>

        <label for="department">Department:</label><br>
        <select id="department" name="department">
            <option value="">-- Select --</option>
            <option value="CSE">Computer Science & Engineering</option>
            <option value="EEE">Electrical & Electronic Engineering</option>
            <option value="SE">Software Engineering</option>
            <option value="BBA">Business Administration</option>
        </select><br><br>

        <label for="semester">Semester:</label><br>
        <input type="number" id="semester" name="semester" min="1" max="12"><br><br>

        <label for="cgpa">CGPA:</label><br>
        <input type="number" id="cgpa" name="cgpa" step="0.01" min="0" max="4"><br><br>

        <label>Interests:</label><br>
        <input type="checkbox" id="coding" name="interests" value="Coding">
        <label for="coding">Coding</label>

        <input type="checkbox" id="ai" name="interests" value="AI">
        <label for="ai">AI</label>

        <input type="checkbox" id="networking" name="interests" value="Networking">
        <label for="networking">Networking</label>

        <input type="checkbox" id="electronics" name="interests" value="Electronics">
        <label for="electronics">Electronics</label><br><br>

        <label for="photo">Profile Photo:</label><br>
        <input type="file" id="photo" name="photo" accept="image/*"><br><br>

        <label for="website">Personal Website:</label><br>
        <input type="url" id="website" name="website" placeholder="https://example.com"><br><br>

        <label for="bio">About Yourself:</label><br>
        <textarea id="bio" name="bio" rows="4" cols="30" placeholder="Write a short bio..."></textarea><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <label for="confirmPassword">Confirm Password:</label><br>
        <input type="password" id="confirmPassword" name="confirmPassword" required><br><br>

        <input type="checkbox" id="terms" name="terms" required>
        <label for="terms">I agree to the Terms and Conditions</label><br><br>

        <input type="submit" value="Register">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
